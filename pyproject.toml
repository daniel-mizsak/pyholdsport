# Build System
[build-system]
  requires = ["uv_build>=0.13,<0.14"]
  build-backend = "uv_build"

# Project Metadata
[project]
  name = "pyholdsport"
  version = "0.0.0"
  description = "Unofficial Python library for interacting with Holdsport."
  readme = "README.md"
  license = { file = "LICENSE" }
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  requires-python = ">=3.11"
  dependencies = ["httpx2>=2.13.0", "pydantic>=2.12.5"]

  [project.urls]
    Repository = "https://github.com/daniel-mizsak/pyholdsport"
    Documentation = "https://daniel-mizsak.github.io/pyholdsport/"
    Issues = "https://github.com/daniel-mizsak/pyholdsport/issues"

[dependency-groups]
  dev = [
    "coverage==7.17.0",
    "nox==2026.10.20",
    "prek==0.5.7",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "ty==0.0.91",
  ]
  docs = ["zensical==0.0.72", "mkdocstrings-python==2.0.10"]

# Tools
# Uv
[tool.uv]
  exclude-newer = "1 week"

  [tool.uv.build-backend]
    module-root = "src"
    module-name = "pyholdsport"
