# Project Metadata
[project]
  name = "pyholdsport"
  version = "0.0.0"
  description = "Unofficial Python library for interacting with Holdsport."
  readme = "README.md"
  requires-python = ">=3.11"
  license = "MIT"
  license-files = ["LICENSE"]
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  dependencies = ["httpx2>=2.13.0", "pydantic>=2.12.5"]

  [project.urls]
    Documentation = "https://daniel-mizsak.github.io/pyholdsport/"
    Issues = "https://github.com/daniel-mizsak/pyholdsport/issues"
    Repository = "https://github.com/daniel-mizsak/pyholdsport"

[dependency-groups]
  dev = [
    "coverage==7.17.0",
    "nox==2026.10.20",
    "prek==0.5.9",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.95",
  ]
  docs = ["mkdocstrings-python==2.0.10", "zensical==0.0.74"]

# Build System
[build-system]
  requires = ["uv_build>=0.13,<0.14"]
  build-backend = "uv_build"

# Tools
# Uv
[tool.uv]
  exclude-newer = "1 week"

  [tool.uv.build-backend]
    module-root = "src"
    module-name = "pyholdsport"
